# Development overrides, loaded automatically by `docker compose up`.
# Use `docker compose watch` to sync code changes into the containers.
services:
  backend:
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: sync
          path: ./backend/alembic
          target: /app/alembic
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package-lock.json
